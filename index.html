<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#08080a">
  <title>Login — Kantin Uimsya Putra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    :root{--gold:#ffd600;--indigo:#6366f1;--indigo2:#4f46e5}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#08080a url('assets/bg.jpg') center/cover no-repeat fixed;position:relative;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle,rgba(0,0,0,.05),rgba(0,0,0,.65));pointer-events:none}
    .orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.6}
    .orb.a{width:460px;height:460px;top:-90px;left:6%;background:radial-gradient(circle,rgba(99,102,241,.32),transparent 70%)}
    .orb.b{width:420px;height:420px;bottom:-40px;right:8%;background:radial-gradient(circle,rgba(255,214,0,.22),transparent 70%)}
    .page{position:relative;z-index:1;width:min(92vw,430px)}
    .card{position:relative;padding:34px 30px 28px;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(20,20,28,.55) 45%,rgba(10,10,14,.72) 100%);box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 40px rgba(255,140,0,.10),inset 0 1px 1px rgba(255,255,255,.35);-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%)}
    .card::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),rgba(255,214,0,.5),rgba(255,255,255,.65),transparent)}
    .logo-wrap{width:92px;height:92px;margin:0 auto 18px;display:grid;place-items:center;border-radius:26px;padding:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,214,0,.35);box-shadow:0 0 24px rgba(255,214,0,.18)}.logo{width:100%;height:100%;object-fit:contain}
    .fallback{display:none;font-size:38px}
    h1{margin:0;text-align:center;font-family:'Space Grotesk','Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.4px}
    .sub{text-align:center;color:rgba(255,255,255,.6);margin:8px 0 24px;font-size:13.5px}
    .field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.78)}
    .wrap{position:relative}
    input{width:100%;border:1px solid rgba(255,255,255,.16);outline:0;border-radius:13px;padding:13px 15px;background:rgba(14,14,20,.55);color:#fff;font:inherit;font-size:14.5px;transition:.25s}
    input::placeholder{color:rgba(255,255,255,.38)}
    input:focus{border-color:rgba(255,214,0,.65);box-shadow:0 0 14px rgba(255,214,0,.22)}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:rgba(255,255,255,.55);cursor:pointer;font-size:12px;font-weight:700;padding:6px 8px}
    button.submit{width:100%;padding:14px;margin-top:6px;border-radius:13px;background:linear-gradient(135deg,#1f1f2a,#0e0f15);color:#fff;font:inherit;font-weight:800;cursor:pointer;font-size:15px;border:1px solid rgba(255,214,0,.45);box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.22);transition:.25s}
    button.submit:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(255,214,0,.35),inset 0 1px 1px rgba(255,255,255,.4);transform:translateY(-1px)}
    button.submit:disabled{opacity:.6;cursor:wait;transform:none}
    .msg{display:none;margin-top:13px;padding:11px 13px;border-radius:12px;font-size:13px;background:rgba(244,63,94,.18);border:1px solid rgba(244,63,94,.3);color:#fda4af}.msg.show{display:block}
    .msg.warn{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.3);color:#fcd34d}
    .foot{text-align:center;color:rgba(255,255,255,.45);font-size:11.5px;margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <i class="orb a"></i><i class="orb b"></i>
  <main class="page"><section class="card">
    <div class="logo-wrap"><img class="logo" src="assets/logo.png" alt="Logo Kantin" onerror="this.style.display='none';document.querySelector('.fallback').style.display='block'"><span class="fallback">🏪</span></div>
    <h1>Kantin Uimsya Putra</h1><div class="sub">Sistem Keuangan & Operasional Kantin</div>
    <div class="msg" id="preMsg"></div>
    <form id="loginForm">
      <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" placeholder="Masukkan username" required></div>
      <div class="field"><label for="password">Password</label><div class="wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button type="button" class="toggle" id="toggle">👁</button></div></div>
      <button class="submit" id="loginBtn" type="submit">Masuk</button>
      <div class="msg" id="loginMsg"></div>
    </form>
    <div class="foot">Login menggunakan username. Admin dapat membuat akun pengguna dari dalam aplikasi.</div>
  </section></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
  (()=>{
    const form=document.getElementById('loginForm'),
          u=document.getElementById('username'),
          p=document.getElementById('password'),
          b=document.getElementById('loginBtn'),
          m=document.getElementById('loginMsg'),
          pre=document.getElementById('preMsg');

    // Tampilkan pesan error dari URL param (redirect dari app)
    const params=new URLSearchParams(location.search);
    const errMap={
      no_access:'⚠️ Akun Anda belum memiliki akses. Hubungi admin untuk mendapatkan akses.',
      deactivated:'🚫 Akun Anda telah dinonaktifkan. Hubungi admin.',
      session_expired:'🔒 Sesi berakhir. Silakan login kembali.'
    };
    const preErr=params.get('error');
    if(preErr&&errMap[preErr]){pre.textContent=errMap[preErr];pre.className='msg warn show';}

    document.getElementById('toggle').onclick=()=>{
      const v=p.type==='password';
      p.type=v?'text':'password';
      document.getElementById('toggle').textContent=v?'🙈':'👁';
    };

    const show=t=>{m.textContent=t;m.className='msg show'};

    supabaseClient.auth.getSession().then(({data})=>{
      if(data.session) location.replace('app.html');
    }).catch(()=>{});

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const username=u.value.trim(),password=p.value;
      if(!username||!password)return show('Username dan password wajib diisi.');
      const clean=username.toLowerCase().replace(/[^a-z0-9._-]/g,'');
      if(!clean)return show('Username tidak valid.');
      const email=clean+'@kantin-uimsya.local';
      b.disabled=true;b.textContent='Memeriksa...';m.className='msg';
      try{
        const {error}=await supabaseClient.auth.signInWithPassword({email,password});
        if(error)throw error;
        location.replace('app.html');
      }catch(err){
        console.error(err);
        show('Login gagal: '+(err.message||'Kredensial tidak sesuai.'));
      }finally{
        b.disabled=false;b.textContent='Masuk';
      }
    });
  })();
  </script>
</body>
</html>
